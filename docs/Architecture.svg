<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 610" width="900" height="610" font-family="Arial, Helvetica, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="900" height="610" fill="#ffffff"/>

  <!-- Cluster backgrounds -->
  <rect x="15" y="15" width="475" height="425" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="30" y="35" fill="#64748B" font-weight="bold">Application Layer</text>
  <rect x="620" y="15" width="260" height="575" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="635" y="35" fill="#64748B" font-weight="bold">Analytics Layer</text>

  <!-- ===== Application side ===== -->
  <rect x="140" y="50" width="200" height="40" rx="6" fill="#DBEAFE" stroke="#60A5FA"/>
  <text x="240" y="75" text-anchor="middle" fill="#1E40AF">Sponsors / Influencers / Admins</text>

  <rect x="140" y="140" width="200" height="50" rx="6" fill="#DBEAFE" stroke="#60A5FA"/>
  <text x="240" y="170" text-anchor="middle" fill="#1E40AF">FastAPI + Jinja2 Application</text>

  <!-- PostgreSQL -->
  <path d="M30,270 a60,8 0 0 1 120,0 v34 a60,8 0 0 1 -120,0 z" fill="#D1FAE5" stroke="#34D399"/>
  <ellipse cx="90" cy="270" rx="60" ry="8" fill="#D1FAE5" stroke="#34D399"/>
  <text x="90" y="297" text-anchor="middle" fill="#065F46">PostgreSQL</text>

  <!-- Redis -->
  <path d="M180,270 a60,8 0 0 1 120,0 v34 a60,8 0 0 1 -120,0 z" fill="#D1FAE5" stroke="#34D399"/>
  <ellipse cx="240" cy="270" rx="60" ry="8" fill="#D1FAE5" stroke="#34D399"/>
  <text x="240" y="290" text-anchor="middle" fill="#065F46" font-size="11">Redis Analytics</text>
  <text x="240" y="303" text-anchor="middle" fill="#065F46" font-size="11">Cache</text>

  <!-- Kafka -->
  <rect x="330" y="262" width="120" height="50" rx="6" fill="#DBEAFE" stroke="#60A5FA"/>
  <text x="390" y="292" text-anchor="middle" fill="#1E40AF">Apache Kafka</text>

  <!-- PySpark Streaming -->
  <rect x="310" y="360" width="160" height="50" rx="6" fill="#DBEAFE" stroke="#60A5FA"/>
  <text x="390" y="381" text-anchor="middle" fill="#1E40AF" font-size="12">PySpark Streaming</text>
  <text x="390" y="397" text-anchor="middle" fill="#1E40AF" font-size="12">Local Test</text>

  <!-- Application arrows -->
  <line x1="240" y1="90" x2="240" y2="139" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="200" y1="190" x2="100" y2="261" stroke="#475569" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="240" y1="190" x2="240" y2="261" stroke="#475569" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="280" y1="190" x2="380" y2="261" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="372" y="222" fill="#475569" font-size="11">Ad-request events</text>
  <line x1="390" y1="312" x2="390" y2="359" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== Analytics side ===== -->
  <rect x="650" y="50" width="200" height="50" rx="6" fill="#EDE9FE" stroke="#A78BFA"/>
  <text x="750" y="80" text-anchor="middle" fill="#5B21B6">Microsoft Fabric Data Pipeline</text>

  <rect x="650" y="140" width="200" height="50" rx="6" fill="#EDE9FE" stroke="#A78BFA"/>
  <text x="750" y="170" text-anchor="middle" fill="#5B21B6" font-size="12">PySpark Transformation Notebook</text>

  <!-- Bronze -->
  <path d="M650,240 a100,8 0 0 1 200,0 v34 a100,8 0 0 1 -200,0 z" fill="#D1FAE5" stroke="#34D399"/>
  <ellipse cx="750" cy="240" rx="100" ry="8" fill="#D1FAE5" stroke="#34D399"/>
  <text x="750" y="271" text-anchor="middle" fill="#065F46">Bronze - Raw Data</text>

  <!-- Silver -->
  <path d="M650,330 a100,8 0 0 1 200,0 v34 a100,8 0 0 1 -200,0 z" fill="#D1FAE5" stroke="#34D399"/>
  <ellipse cx="750" cy="330" rx="100" ry="8" fill="#D1FAE5" stroke="#34D399"/>
  <text x="750" y="361" text-anchor="middle" fill="#065F46">Silver - Cleaned Data</text>

  <!-- Gold -->
  <path d="M650,420 a100,8 0 0 1 200,0 v34 a100,8 0 0 1 -200,0 z" fill="#D1FAE5" stroke="#34D399"/>
  <ellipse cx="750" cy="420" rx="100" ry="8" fill="#D1FAE5" stroke="#34D399"/>
  <text x="750" y="445" text-anchor="middle" fill="#065F46" font-size="11">Gold - Dimension and</text>
  <text x="750" y="458" text-anchor="middle" fill="#065F46" font-size="11">Fact Tables</text>

  <rect x="650" y="520" width="200" height="50" rx="6" fill="#EDE9FE" stroke="#A78BFA"/>
  <text x="750" y="550" text-anchor="middle" fill="#5B21B6">Power BI - Five Report Pages</text>

  <!-- Analytics arrows -->
  <line x1="750" y1="100" x2="750" y2="139" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="760" y="125" fill="#475569" font-size="11">Orchestrates</text>
  <line x1="750" y1="190" x2="750" y2="231" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="750" y1="282" x2="750" y2="321" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="750" y1="372" x2="750" y2="411" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="750" y1="462" x2="750" y2="519" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Dotted: PostgreSQL -> Bronze -->
  <path d="M90,312 V480 H560 V257 H649" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="325" y="472" text-anchor="middle" fill="#475569" font-size="11">Separate analytics ingestion</text>
</svg>